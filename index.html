:root {
  color-scheme: light;
  --desktop: #008080;
  --face: #c0c0c0;
  --white: #fff;
  --shadow: #808080;
  --dark: #000;
  --title: #000080;
  --ui-font: W95FA, 'WenQuanYi Bitmap Song 12px', 'MS Sans Serif', Arial, sans-serif;
  --raised: inset -1px -1px #000, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
  --window-edge: inset -1px -1px #000, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff;
  --sunken: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #000;
  font-family: var(--ui-font);
  font-size: 12px;
}
* { box-sizing: border-box; touch-action: manipulation; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { font-family: var(--ui-font); font-size: 12px; background: var(--desktop); color: #000; line-height: 1.25; user-select: none; -webkit-font-smoothing: none; font-smooth: never; }
button, input { font: inherit; color: inherit; border-radius: 0; }

          press.timer = null;
          if (activePress === press && !press.cancelled) flagPress(press);
        }, delay);
      },
      pointerMove(event) {
        const press = activePress;
        if (!press || press.handled || press.cancelled) return;
        if (event.pointerId !== undefined && press.pointerId !== undefined && event.pointerId !== press.pointerId) return;
        if (press.x === null || press.y === null || !Number.isFinite(event.clientX) || !Number.isFinite(event.clientY)) return;
        if (Math.abs(event.clientX - press.x) > moveTolerance || Math.abs(event.clientY - press.y) > moveTolerance) {
          press.cancelled = true;
          clearTimer(press);
        }
      },
      pointerEnd(pointerId) {
        if (!activePress) return;
        if (pointerId !== undefined && activePress.pointerId !== undefined && pointerId !== activePress.pointerId) return;
        cancelPress();
      },
      contextMenu() {
        const timestamp = Date.now();
        if (activePress) {
          if (!activePress.cancelled) flagPress(activePress);
          ignoreContextMenuUntil = Math.max(ignoreContextMenuUntil, timestamp + suppression);
          return true;
        }
        if (timestamp < ignoreContextMenuUntil) { ignoreContextMenuUntil = 0; return true; }
        return false;
      },
      consumeClick(index) {
        if (!suppressedClick) return false;
        if (Date.now() >= suppressedClick.until) { suppressedClick = null; return false; }
        if (suppressedClick.index !== index) return false;
        suppressedClick = null;
        return true;
      },
      cancel() { cancelPress(); ignoreContextMenuUntil = 0; suppressedClick = null; },
    };
  }

  let rows = 8, cols = 8, mines = 10;
  let game = new Minesweeper(rows, cols, mines);
  let startTime = 0, seconds = 0, timer = null, pressed = false;
  let openMenuButton = null, returnFocus = null, lastTouchTap = null;
  let bestTimes = loadBestTimes();

  function loadBestTimes() {
    try { return JSON.parse(localStorage.getItem('lingyicute-minesweeper-best') || '{}') || {}; }
    catch { return {}; }
  }
  function saveBestTimes() {
    try { localStorage.setItem('lingyicute-minesweeper-best', JSON.stringify(bestTimes)); }
    catch { /* Storage is optional for a file:// standalone copy. */ }
  }
  function paintCounter(node, value) {
    node.innerHTML = counterMarkup(value);
    node.setAttribute('aria-label', counterChars(value));
  }
  function paintFace() {
    const state = game.state === 'lost' ? 'lost' : game.state === 'won' ? 'won' : pressed ? 'pressed' : 'smile';
    faceButton.innerHTML = faceMarkup(state);
  }
  function finish() {
    if (game.state !== 'won' && game.state !== 'lost') return;
    clearInterval(timer);
    timer = null;
    if (game.state === 'won') {
      const key = `${rows}x${cols}:${mines}`;
      if (bestTimes[key] === undefined || seconds < bestTimes[key]) {
        bestTimes[key] = seconds;
        saveBestTimes();
      }
    }
  }
  function render() {
    paintCounter(mineCounter, mines - game.flags);
    paintCounter(timeCounter, seconds);
    paintFace();
    board.style.gridTemplateColumns = `repeat(${cols}, 20px)`;
    board.replaceChildren();
    const lost = game.state === 'lost';
    game.cells.forEach((cell, index) => {
      const shown = lost && cell.mine && !cell.flagged ? { ...cell, revealed: true } : cell;
      const wrong = lost && cell.flagged && !cell.mine;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `mine-cell${cellClass(shown, game.exploded === index, wrong)}`;
      button.setAttribute('role', 'gridcell');
      const rowNumber = Math.floor(index / cols) + 1;
      const columnNumber = index % cols + 1;
      const cellStatus = cell.flagged ? t('flagged') : cell.revealed
        ? cell.mine ? t('mine') : `${cell.adjacent} ${cell.adjacent === 1 ? t('adjacentMineSingular') : t('adjacentMinePlural')}`
        : t('covered');
      button.setAttribute('aria-label', language === 'zh'
        ? `第${rowNumber}行第${columnNumber}列，${cellStatus}`
        : `Row ${rowNumber} column ${columnNumber}, ${cellStatus}`);
      button.innerHTML = cellMarkup(shown, wrong);
      button.addEventListener('click', event => {
        if ((event.detail > 0 || event.pointerType === 'touch') && touchFlags.consumeClick(index)) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        reveal(index);
      });
      button.addEventListener('contextmenu', event => {
        event.preventDefault();
        if (!touchFlags.contextMenu()) {
          game.flag(index);
          render();
        }
      });
      button.addEventListener('auxclick', event => {
        if (event.button === 1) {
          event.preventDefault();
          game.chord(index);
          finish();
          render();
        }
      });
      button.addEventListener('dblclick', event => {
        event.preventDefault();
        game.chord(index);
        finish();
        render();
      });
      let touchStart = null;
      button.addEventListener('pointerdown', event => {
        if (event.button === 0) { pressed = true; paintFace(); }
        touchFlags.pointerDown(index, event);
        if (event.pointerType === 'touch') touchStart = { x: event.clientX, y: event.clientY, time: Date.now() };
      });
      button.addEventListener('pointerup', event => {
        if (event.pointerType !== 'touch' || !touchStart) return;
        const start = touchStart;
        touchStart = null;
        const elapsed = Date.now() - start.time;
        if (elapsed > 250 || Math.abs(event.clientX - start.x) > 10 || Math.abs(event.clientY - start.y) > 10) return;
        const now = Date.now();
        if (lastTouchTap && lastTouchTap.index === index && now - lastTouchTap.time <= 500) {
          lastTouchTap = null;
          game.chord(index);
          finish();
          render();
        } else {
          lastTouchTap = { index, time: now };
        }
      });
      button.addEventListener('pointercancel', () => { touchStart = null; });
      board.append(button);
    });
  }
  const touchFlags = createTouchFlagHandler(index => {
    lastTouchTap = null;
    game.flag(index);
    render();
  });
  function reveal(index) {
    const wasReady = game.state === 'ready';
    const changed = game.reveal(index);
    if (changed && wasReady && game.state === 'playing') {
      startTime = Date.now();
      timer = setInterval(() => {
        seconds = Math.floor((Date.now() - startTime) / 1000);
        paintCounter(timeCounter, seconds);
      }, 500);
    }
    finish();
    render();
  }
  function reset(nextRows = rows, nextCols = cols, nextMines = mines) {
    touchFlags.cancel();
    clearInterval(timer);
    timer = null;
    rows = nextRows; cols = nextCols; mines = nextMines;
    game = new Minesweeper(rows, cols, mines);
    startTime = 0; seconds = 0; pressed = false; lastTouchTap = null;
    gameWindow.style.width = `${cols * 20 + 47}px`;
    gameWindow.style.height = `${rows * 20 + 138}px`;
    render();
  }

  function setLanguage(nextLanguage, repaint = true) {
    language = nextLanguage === 'zh' ? 'zh' : 'en';
    document.documentElement.dataset.language = language;
    document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
    document.title = t('pageTitle');
    document.querySelector('meta[name="description"]').setAttribute('content', t('description'));
    titleText.textContent = t('title');
    desktop.setAttribute('aria-label', t('desktop'));
    gameWindow.setAttribute('aria-label', t('window'));
    menuBar.setAttribute('aria-label', t('menus'));
    board.setAttribute('aria-label', t('board'));
    faceButton.setAttribute('aria-label', t('newGame'));
    faceButton.title = t('newGameTitle');
    menuButtons.forEach(button => { button.textContent = t(button.dataset.menu); });
    if (repaint) render();
  }

  function closeMenu() {
    popupLayer.hidden = true;
    popupLayer.replaceChildren();
    if (openMenuButton) openMenuButton.setAttribute('aria-expanded', 'false');
    openMenuButton = null;
  }
  function openMenu(menuButton, items) {
    if (openMenuButton === menuButton) { closeMenu(); return; }
    closeMenu();
    const menu = document.createElement('div');
    menu.className = 'popup-menu';
    menu.setAttribute('role', 'menu');
    for (const item of items) {
      if (item.separator) {
        const separator = document.createElement('div');
        separator.className = 'menu-separator';
        separator.setAttribute('role', 'separator');
        menu.append(separator);
        continue;
      }
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'menu-item';
      row.setAttribute('role', 'menuitem');
      const check = document.createElement('span');
      check.className = 'menu-check';
      check.textContent = item.checked ? '✓' : '';
      const label = document.createElement('span');
      label.className = 'menu-label';
      label.textContent = item.label;
      row.append(check, label);
      if (item.shortcut) {
        const shortcut = document.createElement('span');
        shortcut.className = 'menu-shortcut';
        shortcut.textContent = item.shortcut;
        row.append(shortcut);
      }
      row.disabled = !!item.disabled;
      row.addEventListener('click', () => { closeMenu(); if (!item.disabled) item.action(); });
      menu.append(row);
    }
    popupLayer.append(menu);
    popupLayer.hidden = false;
    openMenuButton = menuButton;
    menuButton.setAttribute('aria-expanded', 'true');
    const rect = menuButton.getBoundingClientRect();
    const menuRect = menu.getBoundingClientRect();
    menu.style.left = `${Math.max(0, Math.min(rect.left, innerWidth - menuRect.width))}px`;
    menu.style.top = `${Math.max(0, Math.min(rect.bottom, innerHeight - menuRect.height))}px`;
    menu.querySelector('.menu-item:not(:disabled)')?.focus();
  }
  function menuItems(name) {
    if (name === 'game') return [
      { label: t('new'), shortcut: 'F2', action: () => reset() },
      { separator: true },
      { label: t('beginner'), checked: rows === 8 && cols === 8 && mines === 10, action: () => reset(8, 8, 10) },
      { label: t('intermediate'), checked: rows === 16 && cols === 16 && mines === 40, action: () => reset(16, 16, 40) },
      { label: t('expert'), checked: rows === 20 && cols === 20 && mines === 80, action: () => reset(20, 20, 80) },
      { label: t('custom'), action: showCustom },
      { separator: true },
      { label: t('bestTimes'), action: showBestTimes },
    ];
    if (name === 'language') return [
      { label: 'English', checked: language === 'en', action: () => setLanguage('en') },
      { label: '中文', checked: language === 'zh', action: () => setLanguage('zh') },
    ];
    return [
      { label: t('howToPlay'), action: showHelp },
      { label: t('about'), action: showAbout },
    ];
  }
  menuButtons.forEach(button => button.addEventListener('click', () => openMenu(button, menuItems(button.dataset.menu))));
  document.addEventListener('pointerdown', event => {
    const insideMenuButton = menuButtons.some(button => button === event.target || button.contains(event.target));
    if (!popupLayer.contains(event.target) && !insideMenuButton) closeMenu();
  });

  function closeDialog() {
    dialogLayer.hidden = true;
    dialogLayer.replaceChildren();
    if (returnFocus && returnFocus.isConnected) returnFocus.focus();
    returnFocus = null;
  }
  function openDialog(title, content, buttons, focusTarget = null) {
    closeMenu();
    returnFocus = document.activeElement;
    const frame = document.createElement('section');
    frame.className = 'dialog-window';
    frame.setAttribute('role', 'dialog');
    frame.setAttribute('aria-modal', 'true');
    frame.setAttribute('aria-label', title);
    const bar = document.createElement('div');
    bar.className = 'dialog-title';
    bar.textContent = title;
    const body = document.createElement('div');
    body.className = 'dialog-body';
    body.append(content);
    const footer = document.createElement('div');
    footer.className = 'dialog-buttons';
    for (const item of buttons) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = item.label;
      if (item.default) button.classList.add('default-button');
      button.addEventListener('click', item.action);
      footer.append(button);
    }
    frame.append(bar, body, footer);
    dialogLayer.replaceChildren(frame);
    dialogLayer.hidden = false;
    (focusTarget || footer.querySelector('.default-button') || footer.querySelector('button'))?.focus();
  }
  function showAbout() {
    const content = document.createElement('div');
    const brand = document.createElement('div');
    brand.className = 'about-brand';
    const icon = document.createElement('div');
    icon.className = 'about-icon';
    icon.innerHTML = '<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAC0klEQVR4AcXBjXGaORhG0SucQtSJXneSTrh04nTyqJNQiZZvDLMY45/Y2dlzGl+UZCVhoza+aMcXJFljDKqKs8UX7fif7fif7bgjyUqyuCPJ4kYSThb3LWDxhgduJFljDHrvPD4++vT0dOAkyfr586djDI7HI713jscjvXeSoPL09CQgcODZOqG1RhKBAzcaV5IszsYYbOacXIwxmHMyxmDOyRiDOSebJFQVSVDZrLU4HA5sVM4aVx640nv39+/f9N45Ho/03um903un986ckzEGc07GGMw5uei9k4SqovdOVfH4+EhVoXLlwJXGDXVxUlVsxhhs5pyMMZhzMsZgzsm1JFQVSbhQudG4seOG2jgbY7CZczLGYM7JZs7JtSRUFUmoKjYqKlcad+x4wxiDzZyTMQZzTu5JQlWRhKoiCRsVFZX37LihrqpiM+dkjMGck3uSUFUkoapIQlWxUVFROVvcseOOMQZzTsYYzDm5loQkJKGqSEJVkYSqIgkbFRWV9zxwo6psrTHGYM7JtSRs9vs9VcWvX79Q6b1TVSThQkVF5YrAgSuNE3Vxtt/v2RwOB6qKJFQVSdjs93vmnGySoLJRuVBRUVFReUP7oa79fs/FnJMkVBVJqCqSUFUk4S0qKioqKioq71g/OJlzcpGEqiIJVUUSqookqLxHRUVFReWWyoVKA5bKRVWRhKoiCVVFEqqKJKh8REXlMxrPFmcqH1F5i4rKJ7XGS4sTlbeoqKjcUlH5QOPKjjtUNioblY2KiorKRmWjovKBxo3Ga4szFRUVFRUVFRUVFRWVT2jcaLy2uKKioqKioqKioqLyCY07GvctrqiofFPjjsZrS0XlP9C48cBLS6Wq6L2ThL9M4MCVHTeqiiSo/A0q72m8tnipAYs/03i2OFFROWncaNy3eNZ4afG+xmuLZ407Gl+3OFFROWv8oR3foPJdje9Z/KvxBf8ABES99gLxvAAAAAAASUVORK5CYII=" width="32" height="32" alt="" aria-hidden="true">';
    const text = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'about-name';
    name.textContent = t('title');
    const byline = document.createElement('div');
    byline.className = 'about-byline';
    byline.textContent = 'Proudly presented by lingyicute via her Win95 project.';
    text.append(name, byline);
    brand.append(icon, text);
    content.append(brand);
    openDialog(t('about'), content, [{ label: t('ok'), default: true, action: closeDialog }]);
  }
  function showHelp() {
    const content = document.createElement('p');
    content.className = 'dialog-copy';
    content.textContent = t('helpText');
    openDialog(t('howToPlay'), content, [{ label: t('ok'), default: true, action: closeDialog }]);
  }
  function showBestTimes() {
    const content = document.createElement('p');
    content.className = 'dialog-copy';
    content.textContent = [
      `${t('beginner')}${t('colon')} ${bestTimes['8x8:10'] ?? '—'} ${t('seconds')}`,
      `${t('intermediate')}${t('colon')} ${bestTimes['16x16:40'] ?? '—'} ${t('seconds')}`,
      `${t('expert')}${t('colon')} ${bestTimes['16x30:99'] ?? '—'} ${t('seconds')}`,
    ].join('\n');
    openDialog(t('bestTimesTitle'), content, [{ label: t('ok'), default: true, action: closeDialog }]);
  }
  function showCustom() {
    const content = document.createElement('form');
    const fields = document.createElement('div');
    fields.className = 'form-grid';
    const values = [
      ['rows', t('rows'), rows, 8, 24],
      ['columns', t('columns'), cols, 8, 30],
      ['mines', t('mines'), mines, 1, 719],
    ];
    const inputs = [];
    for (const [field, labelText, value, min, max] of values) {
      const label = document.createElement('label');
      label.textContent = `${labelText}${t('colon')}`;
      const input = document.createElement('input');
      input.type = 'number';
      input.min = String(min);
      input.max = String(max);
      input.step = '1';
      input.value = String(value);
      input.setAttribute('aria-label', labelText);
      label.htmlFor = `custom-${field}`;
      input.id = label.htmlFor;
      inputs.push(input);
      fields.append(label, input);
    }
    const error = document.createElement('div');
    error.className = 'form-error';
    error.setAttribute('aria-live', 'polite');
    content.append(fields, error);
    content.addEventListener('submit', event => {
      event.preventDefault();
      const [nextRows, nextCols, nextMines] = inputs.map(input => Number(input.value));
      if (!Number.isInteger(nextRows) || nextRows < 8 || nextRows > 24
        || !Number.isInteger(nextCols) || nextCols < 8 || nextCols > 30
        || !Number.isInteger(nextMines) || nextMines < 1 || nextMines >= nextRows * nextCols) {
        error.textContent = t('invalidCustom');
        return;
      }
      closeDialog();
      reset(nextRows, nextCols, nextMines);
    });
    openDialog(t('customField'), content, [
      { label: t('ok'), default: true, action: () => content.requestSubmit() },
      { label: t('cancel'), action: closeDialog },
    ], inputs[0]);
  }

  function positionInitially() {
    const width = cols * 20 + 47;
    const height = rows * 20 + 138;
    gameWindow.style.left = `${Math.max(96, (innerWidth - width) / 2)}px`;
    gameWindow.style.top = `${Math.max(25, (innerHeight - height) / 2)}px`;
  }
  function keepTitleVisible() {
    const left = Number.parseFloat(gameWindow.style.left) || 0;
    const top = Number.parseFloat(gameWindow.style.top) || 0;
    gameWindow.style.left = `${Math.max(0, Math.min(left, innerWidth - 80))}px`;
    gameWindow.style.top = `${Math.max(0, Math.min(top, innerHeight - 70))}px`;
  }
  let drag = null;
  titleBar.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    const rect = gameWindow.getBoundingClientRect();
    drag = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, left: rect.left, top: rect.top };
    titleBar.setPointerCapture(event.pointerId);
    event.preventDefault();
  });
  titleBar.addEventListener('pointermove', event => {
    if (!drag || drag.pointerId !== event.pointerId) return;
    const width = gameWindow.getBoundingClientRect().width;
    const left = drag.left + event.clientX - drag.x;
    const top = drag.top + event.clientY - drag.y;
    gameWindow.style.left = `${Math.max(-width + 80, Math.min(innerWidth - 50, left))}px`;
    gameWindow.style.top = `${Math.max(0, Math.min(innerHeight - 25, top))}px`;
  });
  const stopDragging = event => {
    if (!drag || drag.pointerId !== event.pointerId) return;
    drag = null;
    try { titleBar.releasePointerCapture(event.pointerId); } catch { /* capture may already be released */ }
  };
  titleBar.addEventListener('pointerup', stopDragging);
  titleBar.addEventListener('pointercancel', stopDragging);

  const releasePointer = event => {
    touchFlags.pointerEnd(event.pointerId);
    if (!pressed) return;
    pressed = false;
    paintFace();
  };
  window.addEventListener('pointerup', releasePointer);
  window.addEventListener('pointercancel', releasePointer);
  window.addEventListener('pointermove', event => touchFlags.pointerMove(event));
  window.addEventListener('resize', keepTitleVisible);
  window.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      if (!dialogLayer.hidden) closeDialog();
      else closeMenu();
      return;
    }
    if (event.key === 'F2' && dialogLayer.hidden) {
      event.preventDefault();
      reset();
    }
  });

  faceButton.addEventListener('click', () => reset());
  setLanguage(language, false);
  positionInitially();
  reset();
})();
</script>
